name: Browser smoke tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    # Pin a supported Ubuntu LTS image: ubuntu-latest moved to a newer
    # distro with intermittent apt mirror/DNS failures during browser setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
